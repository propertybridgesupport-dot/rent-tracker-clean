name: Apply owner report closeout logic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-owner-report-closeout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply owner report patch
        run: node scripts/apply-owner-report-closeout.cjs

      - name: Install dependencies
        run: npm install

      - name: Validate build
        run: npm run build

      - name: Commit app update and remove temporary files
        run: |
          rm -f scripts/apply-owner-report-closeout.cjs
          rm -f .github/workflows/apply-owner-report-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx scripts/apply-owner-report-closeout.cjs .github/workflows/apply-owner-report-closeout.yml
          git commit -m "Tie owner report collections to closeout cycle"
          git push origin HEAD:main
