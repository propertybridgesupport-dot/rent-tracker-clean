name: Apply late fee edit/delete controls

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-late-fee-edit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: node scripts/apply-late-fee-edit.cjs

      - name: Install dependencies
        run: npm install

      - name: Validate build
        run: npm run build

      - name: Commit app update and remove temporary files
        run: |
          rm -f scripts/apply-late-fee-edit.cjs
          rm -f .github/workflows/apply-late-fee-edit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx scripts/apply-late-fee-edit.cjs .github/workflows/apply-late-fee-edit.yml
          git commit -m "Add late fee edit and delete controls"
          git push origin HEAD:main
