name: Clean owner report collected display

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/clean-owner-report-collected.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply owner report display cleanup
        run: node scripts/remove-owner-report-carry-note.cjs

      - name: Install dependencies
        run: npm install

      - name: Validate build
        run: npm run build

      - name: Commit app update and remove temporary files
        run: |
          rm -f scripts/remove-owner-report-carry-note.cjs
          rm -f .github/workflows/clean-owner-report-collected.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx scripts/remove-owner-report-carry-note.cjs .github/workflows/clean-owner-report-collected.yml
          git commit -m "Simplify owner report collected display"
          git push origin HEAD:main
